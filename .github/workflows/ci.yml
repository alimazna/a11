name: XAUUSD Sovereign Windows Release

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-windows:

    runs-on: windows-latest

    env:
      TELEGRAM_OPERATIONS_TOKEN: ${{ secrets.TELEGRAM_OPERATIONS_TOKEN }}
      TELEGRAM_GOVERNANCE_TOKEN: ${{ secrets.TELEGRAM_GOVERNANCE_TOKEN }}
      TELEGRAM_OPERATIONS_CHAT_ID: ${{ secrets.TELEGRAM_OPERATIONS_CHAT_ID }}
      TELEGRAM_GOVERNANCE_CHAT_ID: ${{ secrets.TELEGRAM_GOVERNANCE_CHAT_ID }}


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Install CURL dependency
        shell: powershell
        run: |
          vcpkg install curl:x64-windows


      - name: Setup CMake
        uses: lukka/get-cmake@latest


      - name: Configure
        shell: powershell
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DXAUUSD_BUILD_UI=OFF `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake


      - name: Build
        shell: powershell
        run: |
          cmake --build build --config Release --parallel


      - name: Run Tests
        shell: powershell
        run: |
          ctest --test-dir build -C Release --output-on-failure


      - name: Package Release
        if: success()
        shell: powershell
        run: |

          New-Item -ItemType Directory -Force -Path release

          if (Test-Path build\Release) {
              Copy-Item build\Release\* release\ -Recurse -Force
          }

          if (Test-Path build\bin) {
              Copy-Item build\bin\* release\ -Recurse -Force
          }

          if (Test-Path config) {
              Copy-Item config release\ -Recurse -Force
          }


          Compress-Archive `
            -Path release\* `
            -DestinationPath XAUUSD-Sovereign-Windows.zip `
            -Force


      - name: Upload Windows Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: XAUUSD-Sovereign-Windows
          path: XAUUSD-Sovereign-Windows.zip